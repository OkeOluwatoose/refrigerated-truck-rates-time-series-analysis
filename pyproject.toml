[project]
name = "refrigerated-truck-rates-time-series-analysis"
version = "0.1.0"
description = "Time series analysis of refrigerated truck rates using EIA diesel and gasoline prices"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "ipykernel>=6.25",
    "jupyter>=1.0",
]

[project.optional-dependencies]
extra = [
    "xgboost>=2.0",
    "prophet>=1.1",
    "pmdarima>=2.0",
]
